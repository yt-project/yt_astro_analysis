[build-system]
requires = [
  "scikit-build-core>=0.10",
  "Cython>=3.0",
  "numpy>=2.0.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "yt_astro_analysis"
description = "yt astrophysical analysis modules extension"
authors = [
    { name = "The yt project", email = "yt-dev@python.org" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = [
    "astronomy astrophysics visualization amr adaptivemeshrefinement",
]
requires-python = ">=3.9"
dependencies = [
    "h5py>=3.1.0",
    "yt>=4.0.1",
    "numpy>=1.19.3, <3",
    "packaging>=20.9",
]
dynamic = [
    "version",
]
license = "BSD-3-Clause"


[project.readme]
file = "README.md"
content-type = "text/markdown"


[project.urls]
Homepage = "https://yt-project.org/"
Documentation = "https://yt-astro-analysis.readthedocs.io/"
Source = "https://github.com/yt-project/yt_astro_analysis/"
Tracker = "https://github.com/yt-project/yt_astro_analysis/issues"

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["yt_astro_analysis"]
build-dir = "build/{wheel_tag}"
sdist.include = [
    "CMakeLists.txt",
    "yt_astro_analysis/**",
    "doc/**",
    "README.md",
    "CREDITS",
    "COPYING.txt",
    "CITATION",
    "CONTRIBUTING.rst",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "yt_astro_analysis/__init__.py"

[tool.black]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff.lint]
exclude = ["*__init__.py", "*api.py"]
ignore = [
  "E402",
  "E501",
  "NPY002", # numpy-legacy-random (not actually deprecated, and not auto-fixable)
]

select = [
    "E",
    "F",
    "W",
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "G",   # flake8-logging
    "YTT", # flake8-2020
    "I",   # isort
    "UP",  # pyupgrade
    "NPY", # NumPy-specific rules
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-third-party = [
  "IPython",
  "numpy",
  "sympy",
  "matplotlib",
  "unyt",
  "git",
  "yaml",
  "dateutil",
  "requests",
  "coverage",
  "pytest",
  "pyx",
  "glue",
]
known-first-party = ["yt", "yt_astro_analysis"]


[tool.pytest.ini_options]
filterwarnings = ["error"]
